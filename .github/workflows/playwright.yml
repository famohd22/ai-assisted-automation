name: Playwright Tests with Jira Integration

on:
  push:
    branches: [ trunk, main, develop ]
  pull_request:
    branches: [ trunk, main ]
  schedule:
    # Optional: Run daily at 2 AM mostly
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allows manual triggering

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        browser: [chromium]
        #browser: [chromium, firefox, webkit]
      fail-fast: false  # Don't cancel all jobs if one fails
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    
    - name: Run Playwright tests with Jira integration
      env:
        # Pass Jira secrets as environment variables
        JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        JIRA_ISSUE_TYPE_ID: ${{ secrets.JIRA_ISSUE_TYPE_ID }}
        CREATE_JIRA_BUG: ${{ secrets.CREATE_JIRA_BUG }}
        CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        TEST_ENVIRONMENT: 'ci'
      run: |
        echo "Running tests on ${{ matrix.browser }}"
        npx playwright test --project=${{ matrix.browser }} --reporter=html,json
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ matrix.browser }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
    
    - name: Upload Jira screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jira-screenshots-${{ matrix.browser }}
        path: test-results/jira-attachments/
        retention-days: 14